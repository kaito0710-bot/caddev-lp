<!DOCTYPE html>
<html>
<head>
    <title>座標プロット</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
        }
        .controls {
            margin: 10px 0;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .main-container {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }
        canvas {
            border: 1px solid black;
            cursor: crosshair;
        }
        #coordinates-container {
            width: 350px;
            height: 400px;
            border: 1px solid #ccc;
            overflow-y: auto;
        }
        #coordinates-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        #coordinates-table th, #coordinates-table td {
            border: 1px solid #ddd;
            padding: 4px;
        }
        #coordinates-table th {
            background-color: #f2f2f2;
            text-align: center;
        }
        #coordinates-table td {
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #coordinates-table tbody tr:hover {
            background-color: #f0f0f0;
            cursor: pointer;
        }
        #coordinates-table tbody tr.highlighted-row {
            background-color: #a0e0ff;
        }
        .zoom-controls button {
            width: 30px;
            height: 30px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>座標プロットプログラム</h1>
    <p>
        キャンバスをクリックして点をプロットし、線で繋ぎます。<br>
        <b>スクロール</b>で拡縮、<b>Shift + ドラッグ</b>でパンニングできます。<br>
        3点以上プロットした後にダブルクリックすると、領域が閉じられ、次のクリックから新しい領域の入力を開始できます。<br>
        右クリックで全てのプロットをクリアします。<br>
        右の表の座標を<b>クリック</b>で点を選択、<b>Shift + クリック</b>で領域を複数選択できます。
    </p>
    <div class="controls">
        <div class="file-importer">
            <label for="csv-input">CSVファイル読み込み: </label>
            <input type="file" id="csv-input" accept=".csv">
        </div>
        <div class="zoom-controls">
            <button id="zoom-in-btn">+</button> <span>拡大</span>
            <button id="zoom-out-btn">-</button> <span>縮小</span>
        </div>
    </div>
    <div class="main-container">
        <canvas id="plotCanvas" width="500" height="500"></canvas>
        <div id="coordinates-container">
            <h3>座標リスト</h3>
            <table id="coordinates-table">
                <thead>
                    <tr>
                        <th style="width: 15%;">領域</th>
                        <th style="width: 15%;">点</th>
                        <th>X</th>
                        <th>Y</th>
                        <th>Z</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('plotCanvas');
        const ctx = canvas.getContext('2d');
        const coordinatesTableBody = document.querySelector('#coordinates-table tbody');
        const csvInput = document.getElementById('csv-input');
        const zoomInBtn = document.getElementById('zoom-in-btn');
        const zoomOutBtn = document.getElementById('zoom-out-btn');
        
        let regions = [{ points: [], isClosed: false }];
        let currentRegionIndex = 0;
        
        // --- Selection and Highlight State ---
        let selectedRegions = new Set();
        let highlightedPoint = { regionIndex: -1, pointIndex: -1 };
        let draggedPoint = null;
        let highlightAnimationId = null;
        let pulseRadius = 8;
        let pulseDirection = 1;

        // --- Pan and Zoom State ---
        let scale = 1.0;
        let panOffset = { x: canvas.width / 2, y: canvas.height / 2 };
        let isPanning = false;
        let panStart = { x: 0, y: 0 };
        
        let clickTimer = null;
        const gridSpacing = 20;
        
        function getCanvasPoint(event) {
            const rect = canvas.getBoundingClientRect();
            return { x: event.clientX - rect.left, y: event.clientY - rect.top };
        }

        function getTransformedPoint(canvasX, canvasY) {
            return { x: (canvasX - panOffset.x) / scale, y: (canvasY - panOffset.y) / scale };
        }

        function findPointAt(canvasX, canvasY) {
            const worldPos = getTransformedPoint(canvasX, canvasY);
            const tolerance = 10 / scale; // 10px tolerance, adjusted for scale

            for (let i = regions.length - 1; i >= 0; i--) {
                for (let j = regions[i].points.length - 1; j >= 0; j--) {
                    const point = regions[i].points[j];
                    const distance = Math.sqrt(Math.pow(point.x - worldPos.x, 2) + Math.pow(point.y - worldPos.y, 2));
                    if (distance < tolerance) {
                        return { regionIndex: i, pointIndex: j };
                    }
                }
            }
            return null;
        }

        function drawGridAndAxes() {
            ctx.save();
            ctx.lineWidth = 1 / scale;
            
            const tickLabelInterval = 5 * gridSpacing;

            ctx.strokeStyle = '#e0e0e0';
            const left = Math.floor(-panOffset.x / scale / gridSpacing) * gridSpacing;
            const right = left + (canvas.width + 1) / scale;
            const top = Math.floor(-panOffset.y / scale / gridSpacing) * gridSpacing;
            const bottom = top + (canvas.height + 1) / scale;

            for (let x = left; x < right; x += gridSpacing) {
                ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
            }
            for (let y = top; y < bottom; y += gridSpacing) {
                ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
            }

            ctx.strokeStyle = '#666';
            ctx.beginPath(); ctx.moveTo(left, 0); ctx.lineTo(right, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, top); ctx.lineTo(0, bottom); ctx.stroke();

            ctx.fillStyle = '#333';
            ctx.font = `${10 / scale}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let x = 0; x < right; x += gridSpacing) {
                if (x % tickLabelInterval === 0 && x !== 0) {
                    ctx.beginPath(); ctx.moveTo(x, -5/scale); ctx.lineTo(x, 5/scale); ctx.stroke();
                    ctx.fillText(x, x, 15/scale);
                }
            }
             for (let x = -gridSpacing; x > left; x -= gridSpacing) {
                if (x % tickLabelInterval === 0) {
                    ctx.beginPath(); ctx.moveTo(x, -5/scale); ctx.lineTo(x, 5/scale); ctx.stroke();
                    ctx.fillText(x, x, 15/scale);
                }
            }
            
            ctx.textAlign = 'right';
            for (let y = 0; y < bottom; y += gridSpacing) {
                if (y % tickLabelInterval === 0 && y !== 0) {
                     ctx.beginPath(); ctx.moveTo(-5/scale, y); ctx.lineTo(5/scale, y); ctx.stroke();
                    ctx.fillText(-y, -10/scale, y);
                }
            }
             for (let y = -gridSpacing; y > top; y -= gridSpacing) {
                if (y % tickLabelInterval === 0) {
                     ctx.beginPath(); ctx.moveTo(-5/scale, y); ctx.lineTo(5/scale, y); ctx.stroke();
                    ctx.fillText(-y, -10/scale, y);
                }
            }
            ctx.fillText('0', -10/scale, 15/scale);
            
            ctx.restore();
        }

        function animateHighlight() {
            if (highlightedPoint.pointIndex === -1) {
                highlightAnimationId = null;
                return;
            }
            pulseRadius += (pulseDirection * 0.2);
            if (pulseRadius > 12 || pulseRadius < 6) {
                pulseDirection *= -1;
            }
            redraw();
            highlightAnimationId = requestAnimationFrame(animateHighlight);
        }

        function startHighlightAnimation() {
            if (highlightAnimationId === null) animateHighlight();
        }
        
        function stopHighlightAnimation() {
            if (highlightAnimationId !== null) {
                cancelAnimationFrame(highlightAnimationId);
                highlightAnimationId = null;
            }
        }

        function redraw() {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.translate(panOffset.x, panOffset.y);
            ctx.scale(scale, scale);

            drawGridAndAxes();

            regions.forEach((region, regionIndex) => {
                if (region.points.length === 0) return;
                const isSelected = selectedRegions.has(regionIndex);

                ctx.beginPath();
                ctx.moveTo(region.points[0].x, region.points[0].y);
                for (let i = 1; i < region.points.length; i++) ctx.lineTo(region.points[i].x, region.points[i].y);
                
                ctx.lineWidth = (isSelected ? 2 : 1) / scale;
                if (region.isClosed) {
                    ctx.closePath();
                    ctx.fillStyle = isSelected ? 'rgba(255, 165, 0, 0.5)' : 'rgba(173, 216, 230, 0.5)';
                    ctx.fill();
                    ctx.strokeStyle = isSelected ? 'orange' : 'blue';
                } else {
                     ctx.strokeStyle = isSelected ? 'orange' : 'black';
                }
                ctx.stroke();
            });

            regions.forEach((region, regionIndex) => {
                 region.points.forEach((p, pointIndex) => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 5 / scale, 0, 2 * Math.PI);
                    ctx.fillStyle = 'red';
                    ctx.fill();

                    if (regionIndex === highlightedPoint.regionIndex && pointIndex === highlightedPoint.pointIndex) {
                        ctx.lineWidth = 2 / scale;
                        ctx.strokeStyle = 'rgba(255, 0, 221, 1)';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, pulseRadius / scale, 0, 2 * Math.PI);
                        ctx.stroke();
                    }
                });
            });
            ctx.restore();
        }

        function updateCoordinatesTable() {
            coordinatesTableBody.innerHTML = '';
            regions.forEach((region, regionIndex) => {
                region.points.forEach((p, pointIndex) => {
                    const row = document.createElement('tr');
                    row.dataset.regionIndex = regionIndex;
                    row.dataset.pointIndex = pointIndex;

                    row.innerHTML = `
                        <td style="text-align:center;">${regionIndex + 1}</td>
                        <td style="text-align:center;">${pointIndex + 1}</td>
                        <td contenteditable="true" data-coord="x">${p.x.toFixed(1)}</td>
                        <td contenteditable="true" data-coord="y">${(-p.y).toFixed(1)}</td>
                        <td contenteditable="true" data-coord="z">${(p.z || 0).toFixed(1)}</td>
                    `;
                    
                    if (selectedRegions.has(regionIndex)) row.classList.add('highlighted-row');
                    
                    row.addEventListener('click', (e) => {
                        stopHighlightAnimation();
                        const newRegionIndex = parseInt(row.dataset.regionIndex);
                        
                        if (e.shiftKey) {
                            if (selectedRegions.has(newRegionIndex)) {
                                selectedRegions.delete(newRegionIndex);
                            } else {
                                selectedRegions.add(newRegionIndex);
                            }
                        } else {
                            selectedRegions.clear();
                            selectedRegions.add(newRegionIndex);
                        }

                        highlightedPoint = { regionIndex, pointIndex };
                        startHighlightAnimation();
                        redraw();
                        updateCoordinatesTable();
                    });

                    row.querySelectorAll('td[contenteditable="true"]').forEach(cell => {
                        cell.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } 
                            else if (e.key === 'Escape') { e.preventDefault(); updateCoordinatesTable(); }
                        });
                        cell.addEventListener('blur', (e) => {
                            const newValue = parseFloat(e.target.innerText);
                            if (!isNaN(newValue)) {
                                const coord = e.target.dataset.coord;
                                const point = regions[regionIndex].points[pointIndex];
                                point[coord] = (coord === 'y') ? -newValue : newValue;
                                redraw();
                            }
                            updateCoordinatesTable(); // Re-render to format and clean input
                        });
                    });
                    coordinatesTableBody.appendChild(row);
                });
            });
        }

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const newRegion = { points: [], isClosed: true };
                const lines = e.target.result.split(/\r\n|\n/);
                const startLine = (lines[0] && isNaN(parseFloat(lines[0].split(',')[0]))) ? 1 : 0;
                for(let i = startLine; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    const values = lines[i].split(',').map(v => parseFloat(v.trim()));
                    if (values.length >= 2 && !isNaN(values[0]) && !isNaN(values[1])) {
                        newRegion.points.push({ x: values[0], y: -values[1], z: values[2] || 0 });
                    }
                }
                if (newRegion.points.length > 0) {
                     if (regions.length === 1 && regions[0].points.length === 0) regions = [newRegion];
                     else regions.push(newRegion);
                     currentRegionIndex = regions.length - 1;
                }
                highlightedPoint = { regionIndex: -1, pointIndex: -1 };
                selectedRegions.clear();
                redraw();
                updateCoordinatesTable();
            };
            reader.readAsText(file);
        }

        csvInput.addEventListener('change', (e) => {
            if (e.target.files[0]) handleFile(e.target.files[0]);
            e.target.value = '';
        });

        canvas.addEventListener('mousedown', (e) => {
            const foundPoint = findPointAt(e.clientX, e.clientY);
            if(e.shiftKey || e.button === 1) {
                isPanning = true;
                panStart = { x: e.clientX, y: e.clientY };
                canvas.style.cursor = 'grabbing';
            } else if (foundPoint) {
                draggedPoint = foundPoint;
                isPanning = false;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panOffset.x += e.clientX - panStart.x;
                panOffset.y += e.clientY - panStart.y;
                panStart = { x: e.clientX, y: e.clientY };
                redraw();
            } else if (draggedPoint) {
                const worldPos = getTransformedPoint(e.clientX, e.clientY);
                regions[draggedPoint.regionIndex].points[draggedPoint.pointIndex].x = worldPos.x;
                regions[draggedPoint.regionIndex].points[draggedPoint.pointIndex].y = worldPos.y;
                redraw();
                updateCoordinatesTable();
            }
        });

        canvas.addEventListener('mouseup', () => {
            isPanning = false;
            draggedPoint = null;
            canvas.style.cursor = 'crosshair';
        });
        
        canvas.addEventListener('mouseleave', () => {
            isPanning = false;
            draggedPoint = null;
            canvas.style.cursor = 'crosshair';
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomIntensity = 0.1;
            const zoom = Math.exp((e.deltaY < 0 ? 1 : -1) * zoomIntensity);
            const mousePos = getCanvasPoint(e);
            const pointBeforeZoom = getTransformedPoint(mousePos.x, mousePos.y);
            scale *= zoom;
            const pointAfterZoom = getTransformedPoint(mousePos.x, mousePos.y);
            panOffset.x += (pointAfterZoom.x - pointBeforeZoom.x) * scale;
            panOffset.y += (pointAfterZoom.y - pointBeforeZoom.y) * scale;
            redraw();
        });

        function applyZoom(zoomFactor) {
             const center = { x: canvas.width / 2, y: canvas.height / 2};
             const pointBeforeZoom = getTransformedPoint(center.x, center.y);
             scale *= zoomFactor;
             const pointAfterZoom = getTransformedPoint(center.x, center.y);
             panOffset.x += (pointAfterZoom.x - pointBeforeZoom.x) * scale;
             panOffset.y += (pointAfterZoom.y - pointBeforeZoom.y) * scale;
             redraw();
        }

        zoomInBtn.addEventListener('click', () => applyZoom(1.2));
        zoomOutBtn.addEventListener('click', () => applyZoom(1 / 1.2));

        canvas.addEventListener('click', function(e) {
             if (clickTimer === null) {
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    if (isPanning || draggedPoint) return;
                    const worldPos = getTransformedPoint(e.clientX, e.clientY);
                    if (regions.length === 0 || (regions[currentRegionIndex] && regions[currentRegionIndex].isClosed) ) {
                        regions.push({ points: [], isClosed: false });
                        currentRegionIndex = regions.length - 1;
                        selectedRegions.clear();
                        selectedRegions.add(currentRegionIndex);
                    }
                    regions[currentRegionIndex].points.push({ x: worldPos.x, y: worldPos.y, z:0 });
                    highlightedPoint = { regionIndex: currentRegionIndex, pointIndex: regions[currentRegionIndex].points.length - 1 };
                    stopHighlightAnimation();
                    startHighlightAnimation();
                    redraw();
                    updateCoordinatesTable();
                }, 200);
            } else {
                clearTimeout(clickTimer);
                clickTimer = null;
            }
        });

        canvas.addEventListener('dblclick', function(e) {
            if (currentRegionIndex >= regions.length) return;
            const currentRegion = regions[currentRegionIndex];
            if (currentRegion && currentRegion.points.length > 2 && !currentRegion.isClosed) {
                currentRegion.isClosed = true;
                highlightedPoint = { regionIndex: -1, pointIndex: -1 };
                stopHighlightAnimation();
                redraw();
                updateCoordinatesTable();
            }
        });

        canvas.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            regions = [];
            currentRegionIndex = -1;
            selectedRegions.clear();
            highlightedPoint = { regionIndex: -1, pointIndex: -1 };
            scale = 1.0;
            panOffset = { x: canvas.width / 2, y: canvas.height / 2 };
            stopHighlightAnimation();
            redraw();
            updateCoordinatesTable();
        });

        redraw();
    </script>
</body>
</html>
