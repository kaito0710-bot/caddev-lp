<!DOCTYPE html>
<html>
<head>
    <title>座標プロット</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
        }
        .main-container {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }
        canvas {
            border: 1px solid black;
        }
        #coordinates-container {
            width: 350px;
            height: 400px;
            border: 1px solid #ccc;
            overflow-y: auto;
        }
        #coordinates-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        #coordinates-table th, #coordinates-table td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        #coordinates-table th {
            background-color: #f2f2f2;
            text-align: center;
        }
        #coordinates-table td {
            text-align: left;
            white-space: nowrap;
        }
        #coordinates-table tbody tr:hover {
            background-color: #f0f0f0;
            cursor: pointer;
        }
        #coordinates-table tbody tr.highlighted-row {
            background-color: #a0e0ff;
        }
        .file-importer {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>座標プロットプログラム</h1>
    <p>
        キャンバスをクリックして点をプロットし、線で繋ぎます。<br>
        3点以上プロットした後にダブルクリックすると、領域が閉じられ、次のクリックから新しい領域の入力を開始できます。<br>
        右クリックで全てのプロットをクリアします。<br>
        右の表の座標をクリックすると、対応する点と領域がハイライトされます。
    </p>
    <div class="file-importer">
        <label for="csv-input">CSVファイル読み込み: </label>
        <input type="file" id="csv-input" accept=".csv">
    </div>
    <div class="main-container">
        <canvas id="plotCanvas" width="500" height="500"></canvas>
        <div id="coordinates-container">
            <h3>座標リスト</h3>
            <table id="coordinates-table">
                <thead>
                    <tr>
                        <th style="width: 15%;">領域</th>
                        <th style="width: 15%;">点</th>
                        <th>X</th>
                        <th>Y</th>
                        <th>Z</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('plotCanvas');
        const ctx = canvas.getContext('2d');
        const coordinatesTableBody = document.querySelector('#coordinates-table tbody');
        const csvInput = document.getElementById('csv-input');
        
        let regions = [{ points: [], isClosed: false }];
        let currentRegionIndex = 0;
        let highlightedRegionIndex = -1;
        let highlightedPointIndex = -1;
        let clickTimer = null;

        const gridSpacing = 20;
        const origin = { 
            x: Math.round(canvas.width / 2 / gridSpacing) * gridSpacing, 
            y: Math.round(canvas.height / 2 / gridSpacing) * gridSpacing 
        };
        const tickSize = 5;
        const tickLabelInterval = 5 * gridSpacing;

        function drawGrid() {
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;

            // Grid lines
            for (let x = 0; x <= canvas.width; x += gridSpacing) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += gridSpacing) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // Axes
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, origin.y);
            ctx.lineTo(canvas.width, origin.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(origin.x, 0);
            ctx.lineTo(origin.x, canvas.height);
            ctx.stroke();
            
            // Axis Ticks and Labels
            ctx.fillStyle = '#333';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // X-axis ticks
            for (let x = origin.x; x < canvas.width; x += gridSpacing) {
                if ((x - origin.x) % tickLabelInterval === 0) {
                    ctx.beginPath();
                    ctx.moveTo(x, origin.y - tickSize);
                    ctx.lineTo(x, origin.y + tickSize);
                    ctx.stroke();
                    if (x !== origin.x) ctx.fillText((x - origin.x), x, origin.y + 15);
                }
            }
            for (let x = origin.x; x > 0; x -= gridSpacing) {
                 if ((origin.x - x) % tickLabelInterval === 0) {
                    ctx.beginPath();
                    ctx.moveTo(x, origin.y - tickSize);
                    ctx.lineTo(x, origin.y + tickSize);
                    ctx.stroke();
                    if (x !== origin.x) ctx.fillText((x - origin.x), x, origin.y + 15);
                }
            }

            // Y-axis ticks
            ctx.textAlign = 'right';
             for (let y = origin.y; y < canvas.height; y += gridSpacing) {
                if ((y - origin.y) % tickLabelInterval === 0) {
                    ctx.beginPath();
                    ctx.moveTo(origin.x - tickSize, y);
                    ctx.lineTo(origin.x + tickSize, y);
                    ctx.stroke();
                     if (y !== origin.y) ctx.fillText(-(y - origin.y), origin.x - 10, y);
                }
            }
            for (let y = origin.y; y > 0; y -= gridSpacing) {
                if ((origin.y - y) % tickLabelInterval === 0) {
                    ctx.beginPath();
                    ctx.moveTo(origin.x - tickSize, y);
                    ctx.lineTo(origin.x + tickSize, y);
                    ctx.stroke();
                    if (y !== origin.y) ctx.fillText(-(y - origin.y), origin.x - 10, y);
                }
            }
            ctx.fillText('0', origin.x - 10, origin.y + 15);


            ctx.fillStyle = '#666';
            ctx.fillText('X', canvas.width - 10, origin.y - 15);
            ctx.fillText('Y', origin.x + 15, 10);
        }

        function redraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();

            regions.forEach((region, regionIndex) => {
                if (region.points.length === 0) return;

                ctx.beginPath();
                ctx.moveTo(region.points[0].x, region.points[0].y);
                for (let i = 1; i < region.points.length; i++) {
                    ctx.lineTo(region.points[i].x, region.points[i].y);
                }

                if (region.isClosed) {
                    ctx.closePath();
                    ctx.fillStyle = regionIndex === highlightedRegionIndex ? 'rgba(255, 165, 0, 0.5)' : 'rgba(173, 216, 230, 0.5)';
                    ctx.fill();
                    ctx.strokeStyle = regionIndex === highlightedRegionIndex ? 'orange' : 'blue';
                } else {
                     ctx.strokeStyle = regionIndex === highlightedRegionIndex ? 'orange' : 'black';
                }
                ctx.lineWidth = regionIndex === highlightedRegionIndex ? 2 : 1;
                ctx.stroke();
            });

            regions.forEach((region, regionIndex) => {
                 region.points.forEach((p, pointIndex) => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 5, 0, 2 * Math.PI);
                    ctx.fillStyle = 'red';
                    ctx.fill();

                    if (regionIndex === highlightedRegionIndex && pointIndex === highlightedPointIndex) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 8, 0, 2 * Math.PI);
                        ctx.strokeStyle = '#ff4500';
                        ctx.lineWidth = 3;
                        ctx.stroke();
                    }
                });
            });
        }

        function updateCoordinatesTable() {
            coordinatesTableBody.innerHTML = '';
            regions.forEach((region, regionIndex) => {
                region.points.forEach((p, pointIndex) => {
                    const row = document.createElement('tr');
                    
                    const displayX = p.x - origin.x;
                    const displayY = origin.y - p.y;
                    const displayZ = p.z || 0;

                    row.innerHTML = `
                        <td style="text-align:center;">${regionIndex + 1}</td>
                        <td style="text-align:center;">${pointIndex + 1}</td>
                        <td>${displayX.toFixed(1)}</td>
                        <td>${displayY.toFixed(1)}</td>
                        <td>${displayZ.toFixed(1)}</td>
                    `;
                    row.dataset.regionIndex = regionIndex;
                    row.dataset.pointIndex = pointIndex;

                    if (regionIndex === highlightedRegionIndex) {
                        row.classList.add('highlighted-row');
                    }

                    row.addEventListener('click', () => {
                        highlightedRegionIndex = regionIndex;
                        highlightedPointIndex = pointIndex;
                        redraw();
                        updateCoordinatesTable();
                    });

                    coordinatesTableBody.appendChild(row);
                });
            });
        }

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result;
                const newRegions = [{ points: [], isClosed: false }];
                let currentParseRegion = 0;
                
                const lines = text.split(/\r\n|\n/);
                lines.forEach(line => {
                    const values = line.split(',').map(v => parseFloat(v.trim()));
                    if (values.length >= 2 && !isNaN(values[0]) && !isNaN(values[1])) {
                        const x = origin.x + values[0];
                        const y = origin.y - values[1];
                        const z = values.length > 2 ? values[2] : 0;
                        newRegions[currentParseRegion].points.push({ x, y, z });
                    }
                });
                
                regions = newRegions;
                currentRegionIndex = regions.length - 1;
                highlightedRegionIndex = -1;
                highlightedPointIndex = -1;
                redraw();
                updateCoordinatesTable();
            };
            reader.readAsText(file);
        }

        csvInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });


        canvas.addEventListener('click', function(e) {
             if (clickTimer === null) {
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    
                    const rect = canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    if (regions.length === 0 || regions[currentRegionIndex].isClosed) {
                        regions.push({ points: [], isClosed: false });
                        currentRegionIndex = regions.length - 1;
                    }

                    regions[currentRegionIndex].points.push({ x, y, z:0 });
                    
                    highlightedRegionIndex = currentRegionIndex;
                    highlightedPointIndex = regions[currentRegionIndex].points.length - 1;

                    redraw();
                    updateCoordinatesTable();
                }, 200);
            } else {
                clearTimeout(clickTimer);
                clickTimer = null;
            }
        });

        canvas.addEventListener('dblclick', function(e) {
            if (currentRegionIndex >= regions.length) return;
            const currentRegion = regions[currentRegionIndex];
            if (currentRegion.points.length > 2 && !currentRegion.isClosed) {
                currentRegion.isClosed = true;
                highlightedRegionIndex = -1;
                highlightedPointIndex = -1;
                redraw();
                updateCoordinatesTable();
            }
        });

        canvas.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            regions = [{ points: [], isClosed: false }];
            currentRegionIndex = 0;
            highlightedRegionIndex = -1;
            highlightedPointIndex = -1;
            redraw();
            updateCoordinatesTable();
        });

        // Initial draw
        redraw();
    </script>
</body>
</html>
