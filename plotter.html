<!DOCTYPE html>
<html>
<head>
    <title>座標プロット</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
        }
        .controls {
            margin: 10px 0;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .main-container {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }
        canvas {
            border: 1px solid black;
            cursor: crosshair;
        }
        #coordinates-container {
            width: 350px;
            height: 400px;
            border: 1px solid #ccc;
            overflow-y: auto;
        }
        #coordinates-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        #coordinates-table th, #coordinates-table td {
            border: 1px solid #ddd;
            padding: 4px;
        }
        #coordinates-table th {
            background-color: #f2f2f2;
            text-align: center;
        }
        #coordinates-table td {
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #coordinates-table tbody tr:hover {
            background-color: #f0f0f0;
            cursor: pointer;
        }
        #coordinates-table tbody tr.highlighted-row {
            background-color: #a0e0ff;
        }
        .zoom-controls button {
            width: 30px;
            height: 30px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>座標プロットプログラム</h1>
    <p>
        キャンバスをクリックして点をプロットし、線で繋ぎます。<br>
        <b>Ctrl + スクロール</b>で拡縮、<b>Shift + ドラッグ</b>でパンニングできます。<br>
        3点以上プロットした後にダブルクリックすると、領域が閉じられ、次のクリックから新しい領域の入力を開始できます。<br>
        右クリックで全てのプロットをクリアします。<br>
        右の表の座標をクリックすると、対応する点と領域がハイライトされます。
    </p>
    <div class="controls">
        <div class="file-importer">
            <label for="csv-input">CSVファイル読み込み: </label>
            <input type="file" id="csv-input" accept=".csv">
        </div>
        <div class="zoom-controls">
            <button id="zoom-in-btn">+</button> <span>拡大</span>
            <button id="zoom-out-btn">-</button> <span>縮小</span>
        </div>
    </div>
    <div class="main-container">
        <canvas id="plotCanvas" width="500" height="500"></canvas>
        <div id="coordinates-container">
            <h3>座標リスト</h3>
            <table id="coordinates-table">
                <thead>
                    <tr>
                        <th style="width: 15%;">領域</th>
                        <th style="width: 15%;">点</th>
                        <th>X</th>
                        <th>Y</th>
                        <th>Z</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('plotCanvas');
        const ctx = canvas.getContext('2d');
        const coordinatesTableBody = document.querySelector('#coordinates-table tbody');
        const csvInput = document.getElementById('csv-input');
        const zoomInBtn = document.getElementById('zoom-in-btn');
        const zoomOutBtn = document.getElementById('zoom-out-btn');
        
        let regions = [{ points: [], isClosed: false }];
        let currentRegionIndex = 0;
        let highlightedRegionIndex = -1;
        let highlightedPointIndex = -1;
        let clickTimer = null;

        // --- Pan and Zoom State ---
        let scale = 1.0;
        let panOffset = { x: canvas.width / 2, y: canvas.height / 2 };
        let isPanning = false;
        let panStart = { x: 0, y: 0 };
        
        const gridSpacing = 20;
        
        function getCanvasPoint(event) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: event.clientX - rect.left,
                y: event.clientY - rect.top
            };
        }

        function getTransformedPoint(canvasX, canvasY) {
            return {
                x: (canvasX - panOffset.x) / scale,
                y: (canvasY - panOffset.y) / scale
            };
        }

        function drawGridAndAxes() {
            ctx.save();
            ctx.lineWidth = 1 / scale;
            
            const tickLabelInterval = 5 * gridSpacing;

            // --- Grid ---
            ctx.strokeStyle = '#e0e0e0';
            const left = Math.floor(-panOffset.x / scale / gridSpacing) * gridSpacing;
            const right = left + (canvas.width + 1) / scale;
            const top = Math.floor(-panOffset.y / scale / gridSpacing) * gridSpacing;
            const bottom = top + (canvas.height + 1) / scale;

            for (let x = left; x < right; x += gridSpacing) {
                ctx.beginPath();
                ctx.moveTo(x, top);
                ctx.lineTo(x, bottom);
                ctx.stroke();
            }
            for (let y = top; y < bottom; y += gridSpacing) {
                ctx.beginPath();
                ctx.moveTo(left, y);
                ctx.lineTo(right, y);
                ctx.stroke();
            }

            // --- Axes ---
            ctx.strokeStyle = '#666';
            ctx.beginPath();
            ctx.moveTo(left, 0);
            ctx.lineTo(right, 0);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, top);
            ctx.lineTo(0, bottom);
            ctx.stroke();

            // --- Ticks and Labels ---
            ctx.fillStyle = '#333';
            ctx.font = `${10 / scale}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // X-axis ticks
            for (let x = 0; x < right; x += gridSpacing) {
                if (x % tickLabelInterval === 0 && x !== 0) {
                    ctx.beginPath();
                    ctx.moveTo(x, -5/scale);
                    ctx.lineTo(x, 5/scale);
                    ctx.stroke();
                    ctx.fillText(x, x, 15/scale);
                }
            }
             for (let x = -gridSpacing; x > left; x -= gridSpacing) {
                if (x % tickLabelInterval === 0) {
                    ctx.beginPath();
                    ctx.moveTo(x, -5/scale);
                    ctx.lineTo(x, 5/scale);
                    ctx.stroke();
                    ctx.fillText(x, x, 15/scale);
                }
            }

            // Y-axis ticks
            ctx.textAlign = 'right';
            for (let y = 0; y < bottom; y += gridSpacing) {
                if (y % tickLabelInterval === 0 && y !== 0) {
                     ctx.beginPath();
                    ctx.moveTo(-5/scale, y);
                    ctx.lineTo(5/scale, y);
                    ctx.stroke();
                    ctx.fillText(-y, -10/scale, y);
                }
            }
             for (let y = -gridSpacing; y > top; y -= gridSpacing) {
                if (y % tickLabelInterval === 0) {
                     ctx.beginPath();
                    ctx.moveTo(-5/scale, y);
                    ctx.lineTo(5/scale, y);
                    ctx.stroke();
                    ctx.fillText(-y, -10/scale, y);
                }
            }
            ctx.fillText('0', -10/scale, 15/scale);
            
            ctx.restore();
        }


        function redraw() {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.translate(panOffset.x, panOffset.y);
            ctx.scale(scale, scale);

            drawGridAndAxes();

            regions.forEach((region, regionIndex) => {
                if (region.points.length === 0) return;

                ctx.beginPath();
                ctx.moveTo(region.points[0].x, region.points[0].y);
                for (let i = 1; i < region.points.length; i++) {
                    ctx.lineTo(region.points[i].x, region.points[i].y);
                }

                ctx.lineWidth = (regionIndex === highlightedRegionIndex ? 2 : 1) / scale;
                if (region.isClosed) {
                    ctx.closePath();
                    ctx.fillStyle = regionIndex === highlightedRegionIndex ? 'rgba(255, 165, 0, 0.5)' : 'rgba(173, 216, 230, 0.5)';
                    ctx.fill();
                    ctx.strokeStyle = regionIndex === highlightedRegionIndex ? 'orange' : 'blue';
                } else {
                     ctx.strokeStyle = regionIndex === highlightedRegionIndex ? 'orange' : 'black';
                }
                ctx.stroke();
            });

            regions.forEach((region, regionIndex) => {
                 region.points.forEach((p, pointIndex) => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 5 / scale, 0, 2 * Math.PI);
                    ctx.fillStyle = 'red';
                    ctx.fill();

                    if (regionIndex === highlightedRegionIndex && pointIndex === highlightedPointIndex) {
                        ctx.lineWidth = 3 / scale;
                        ctx.strokeStyle = '#ff4500';
                        ctx.stroke();
                    }
                });
            });
            ctx.restore();
        }

        function updateCoordinatesTable() {
            coordinatesTableBody.innerHTML = '';
            regions.forEach((region, regionIndex) => {
                region.points.forEach((p, pointIndex) => {
                    const row = document.createElement('tr');
                    row.dataset.regionIndex = regionIndex;
                    row.dataset.pointIndex = pointIndex;

                    row.innerHTML = `
                        <td style="text-align:center;">${regionIndex + 1}</td>
                        <td style="text-align:center;">${pointIndex + 1}</td>
                        <td contenteditable="true" data-coord="x">${(p.x).toFixed(1)}</td>
                        <td contenteditable="true" data-coord="y">${(-p.y).toFixed(1)}</td>
                        <td contenteditable="true" data-coord="z">${(p.z || 0).toFixed(1)}</td>
                    `;
                    
                    if (regionIndex === highlightedRegionIndex && pointIndex === highlightedPointIndex) {
                        row.classList.add('highlighted-row');
                    }

                    row.addEventListener('click', (e) => {
                        if (e.target.contentEditable !== 'true') {
                           highlightedRegionIndex = regionIndex;
                           highlightedPointIndex = pointIndex;
                           redraw();
                           updateCoordinatesTable();
                        }
                    });

                    // Add blur event listeners to editable cells
                    row.querySelectorAll('td[contenteditable="true"]').forEach(cell => {
                        cell.addEventListener('blur', (e) => {
                            const newValue = parseFloat(e.target.innerText);
                            const coord = e.target.dataset.coord;
                            if (!isNaN(newValue)) {
                                let point = regions[regionIndex].points[pointIndex];
                                if (coord === 'y') {
                                    point[coord] = -newValue; // Negate Y on input
                                } else {
                                    point[coord] = newValue;
                                }
                                redraw();
                            } else {
                                // Revert if input is not a number
                                e.target.innerText = (coord === 'y' ? -regions[regionIndex].points[pointIndex][coord] : regions[regionIndex].points[pointIndex][coord] || 0).toFixed(1);
                            }
                        });
                        cell.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') {
                                e.preventDefault();
                                e.target.blur();
                            } else if (e.key === 'Escape') {
                                e.preventDefault();
                                e.target.innerText = (e.target.dataset.coord === 'y' ? -regions[regionIndex].points[pointIndex][e.target.dataset.coord] : regions[regionIndex].points[pointIndex][e.target.dataset.coord] || 0).toFixed(1);
                                e.target.blur();
                            }
                        });
                    });

                    coordinatesTableBody.appendChild(row);
                });
            });
        }

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result;
                const newRegion = { points: [], isClosed: true }; // CSVs are always closed
                
                const lines = text.split(/\r\n|\n/);
                // Skip header if it exists
                const startLine = (lines[0] && isNaN(parseFloat(lines[0].split(',')[0]))) ? 1 : 0;

                for(let i = startLine; i < lines.length; i++) {
                    const line = lines[i];
                    if (!line.trim()) continue;
                    const values = line.split(',').map(v => parseFloat(v.trim()));
                    if (values.length >= 2 && !isNaN(values[0]) && !isNaN(values[1])) {
                        const x = values[0];
                        const y = -values[1]; // Negate Y for correct display
                        const z = values.length > 2 ? values[2] : 0;
                        newRegion.points.push({ x, y, z });
                    }
                }

                if (newRegion.points.length > 0) {
                     // If the only region is empty, replace it. Otherwise, append.
                     if (regions.length === 1 && regions[0].points.length === 0) {
                        regions = [newRegion];
                        currentRegionIndex = 0;
                    } else {
                        regions.push(newRegion);
                        currentRegionIndex = regions.length - 1;
                    }
                }
                
                highlightedRegionIndex = -1;
                highlightedPointIndex = -1;
                redraw();
                updateCoordinatesTable();
            };
            reader.readAsText(file);
        }

        csvInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
            e.target.value = ''; // Reset input to allow re-uploading the same file
        });

        canvas.addEventListener('mousedown', (e) => {
            if(e.shiftKey || e.button === 1) { // Pan with Shift+Drag or Middle Mouse
                isPanning = true;
                panStart = { x: e.clientX, y: e.clientY };
                canvas.style.cursor = 'grabbing';
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isPanning) {
                const dx = e.clientX - panStart.x;
                const dy = e.clientY - panStart.y;
                panOffset.x += dx;
                panOffset.y += dy;
                panStart = { x: e.clientX, y: e.clientY };
                redraw();
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            isPanning = false;
            canvas.style.cursor = 'crosshair';
        });
        
        canvas.addEventListener('mouseleave', (e) => {
             if (isPanning) {
                isPanning = false;
                canvas.style.cursor = 'crosshair';
            }
        });

        canvas.addEventListener('wheel', (e) => {
            if (!e.ctrlKey) return;
            e.preventDefault();
            const zoomIntensity = 0.1;
            const wheel = e.deltaY < 0 ? 1 : -1;
            const zoom = Math.exp(wheel * zoomIntensity);

            const mousePos = getCanvasPoint(e);
            const pointBeforeZoom = getTransformedPoint(mousePos.x, mousePos.y);

            scale *= zoom;
            
            const pointAfterZoom = getTransformedPoint(mousePos.x, mousePos.y);
            
            panOffset.x += (pointAfterZoom.x - pointBeforeZoom.x) * scale;
            panOffset.y += (pointAfterZoom.y - pointBeforeZoom.y) * scale;
            
            redraw();
        });

        function applyZoom(zoomFactor) {
             const center = { x: canvas.width / 2, y: canvas.height / 2};
             const pointBeforeZoom = getTransformedPoint(center.x, center.y);
             scale *= zoomFactor;
             const pointAfterZoom = getTransformedPoint(center.x, center.y);
             panOffset.x += (pointAfterZoom.x - pointBeforeZoom.x) * scale;
             panOffset.y += (pointAfterZoom.y - pointBeforeZoom.y) * scale;
             redraw();
        }

        zoomInBtn.addEventListener('click', () => applyZoom(1.2));
        zoomOutBtn.addEventListener('click', () => applyZoom(1 / 1.2));


        canvas.addEventListener('click', function(e) {
             if (clickTimer === null) {
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    if (isPanning) return;
                    
                    const canvasPos = getCanvasPoint(e);
                    const worldPos = getTransformedPoint(canvasPos.x, canvasPos.y);

                    if (regions.length === 0 || (regions[currentRegionIndex] && regions[currentRegionIndex].isClosed) ) {
                        regions.push({ points: [], isClosed: false });
                        currentRegionIndex = regions.length - 1;
                    }

                    regions[currentRegionIndex].points.push({ x: worldPos.x, y: worldPos.y, z:0 });
                    
                    highlightedRegionIndex = currentRegionIndex;
                    highlightedPointIndex = regions[currentRegionIndex].points.length - 1;

                    redraw();
                    updateCoordinatesTable();
                }, 200);
            } else {
                clearTimeout(clickTimer);
                clickTimer = null;
            }
        });

        canvas.addEventListener('dblclick', function(e) {
            if (currentRegionIndex >= regions.length) return;
            const currentRegion = regions[currentRegionIndex];
            if (currentRegion && currentRegion.points.length > 2 && !currentRegion.isClosed) {
                currentRegion.isClosed = true;
                highlightedRegionIndex = -1;
                highlightedPointIndex = -1;
                redraw();
                updateCoordinatesTable();
            }
        });

        canvas.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            regions = [];
            currentRegionIndex = -1;
            highlightedRegionIndex = -1;
            highlightedPointIndex = -1;
            scale = 1.0;
            panOffset = {x: 0, y: 0};
            redraw();
            updateCoordinatesTable();
        });

        // Initial draw
        redraw();
    </script>
</body>
</html>
